version: 2.1

references:
  platform-docker: &docker
    docker:
    - image: objectrocket/platform-cicd:latest
      auth:
        username: ${DOCKER_USERNAME}
        password: ${DOCKER_PASSWORD}
  # This is used to update the helm charts on clusters
  context-to-use: &context-to-use
    context: objectrocket-shared
  objectrocket-docker-auth: &objectrocket-docker-auth
    auth:
      username: ${DOCKER_USERNAME}
      password: ${DOCKER_PASSWORD}

orbs:
  aws-cli: circleci/aws-cli@0.1.13

jobs:
  test:
    docker:
    - <<: *objectrocket-docker-auth
      image: circleci/golang:1.13
    steps:
    - checkout
    - run:
        name: run tests
        command: make test

  build:
    docker:
    - <<: *objectrocket-docker-auth
      image: circleci/golang:1.13
    steps:
    - checkout
    - run:
        name: build the binary
        command: make build

  create-release:
    <<: *docker
    steps:
    - add_ssh_keys:
        fingerprints:
        - 16:d0:e3:56:a6:14:8c:7d:dd:94:65:f3:3e:dc:7e:0e
    - checkout
    - run:
        name: create new release
        command: |
          ~/ci-scripts/release-it.sh

workflows:
  version: 2
  # runs on all commits
  build_and_test:
    jobs:
    - test:
        <<: *context-to-use
        filters:
          branches:
            ignore: master
    - build:
        <<: *context-to-use
        filters:
          branches:
            ignore: master

  release:
    jobs:
    - create-release:
        context: platform-eng
        filters:
          branches:
            only: master

  test_build_push:
    jobs:
    - test:
        <<: *context-to-use
        filters:
          tags:
            only:
            - /^[0-9]+.[0-9]+.[0-9]+$/
            - /^[0-9]+.[0-9]+.[0-9]+-rc[0-9]+$/
          branches:
            ignore: /.*/
    - build:
        context: platform-eng
        requires:
        - test
        filters:
          tags:
            only:
            - /^[0-9]+.[0-9]+.[0-9]+$/
            - /^[0-9]+.[0-9]+.[0-9]+-rc[0-9]+$/
          branches:
            ignore: /.*/
