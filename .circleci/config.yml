version: 2.1

references:
  platform-docker: &docker
    docker:
      - image: objectrocket/cicd:slim
        auth:
          username: ${DOCKER_USERNAME}
          password: ${DOCKER_PASSWORD}
  # This is used to update the helm charts on clusters
  context-to-use: &context-to-use
    context: objectrocket-shared
  objectrocket-docker-auth: &objectrocket-docker-auth
    auth:
      username: ${DOCKER_USERNAME}
      password: ${DOCKER_PASSWORD}

orbs:
  aws-cli: circleci/aws-cli@0.1.13

jobs:
  test:
    docker:
      - <<: *objectrocket-docker-auth
        image: circleci/golang:1.13
    steps:
      - checkout
      - run:
          name: Run tests
          command: make ci-test

  build:
    docker:
      - <<: *objectrocket-docker-auth
        image: circleci/golang:1.13
    steps:
      - checkout
      - run:
          name: Build the binary
          command: make build

  create-release:
    <<: *docker
    steps:
      - checkout
      - run:
          name: Setup environment variables
          command: |
            echo "export RELEASE_IT_CONFIG_FILE=$HOME/release-it.yml" >> $BASH_ENV
            echo $(ls $HOME/)
            echo $(ls $HOME/project)
            echo $(pwd)
            source $BASH_ENV
      - run:
          name: Create new release
          command: |
            ~/ci-scripts/release-it.sh

workflows:
  version: 2
  # runs on all commits
  build_and_test:
    jobs:
      - test:
          <<: *context-to-use
          filters:
            branches:
              ignore: master
      - build:
          <<: *context-to-use
          filters:
            branches:
              ignore: master

  release:
    jobs:
      - create-release:
          context: platform-eng
          filters:
            branches:
              only: pbm-build-release  # TODO: Change to master

  test_build_push:
    jobs:
      - test:
          <<: *context-to-use
          filters:
            tags:
              only:
                - /^v*[0-9]+.[0-9]+.[0-9]+$/
                - /^v*[0-9]+.[0-9]+.[0-9]+-rc[0-9]+$/
            branches:
              ignore: /.*/
      - build:
          context: platform-eng
          requires:
            - test
          filters:
            tags:
              only:
                - /^v*[0-9]+.[0-9]+.[0-9]+$/
                - /^v*[0-9]+.[0-9]+.[0-9]+-rc[0-9]+$/
            branches:
              ignore: /.*/
      - create-release:
          context: platform-eng
          requires:
            - test
          filters:
            tags:
              only:
                - /^v*[0-9]+.[0-9]+.[0-9]+$/
                - /^v*[0-9]+.[0-9]+.[0-9]+-rc[0-9]+$/
            branches:
              ignore: /.*/
